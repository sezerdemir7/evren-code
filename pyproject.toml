[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evren-code"
version = "0.2.0"
description = "Autonomous Software Engineering Agent for EVREN AI Platform"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Evren-Code"}
]
dependencies = [
    "httpx>=0.27.0",
    "pyyaml>=6.0.1",
    "rich>=13.7.0",
    "prompt_toolkit>=3.0.43",
    "python-dotenv>=1.0.1",
    "tree-sitter>=0.23.0",
    "tree-sitter-python>=0.23.0",
    "tree-sitter-java>=0.23.0",
    "tree-sitter-javascript>=0.23.0",
    "tree-sitter-typescript>=0.23.0",
    "tree-sitter-go>=0.23.0",
    "tree-sitter-rust>=0.23.0",
    "mcp>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.urls]
Homepage = "https://github.com/sezerdemir7/evren-code"
Repository = "https://github.com/sezerdemir7/evren-code"

[project.scripts]
evren = "evren_code.cli:main"
evren-code = "evren_code.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
evren_code = ["prompts/*.md", "config.default.yaml"]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
    ".git",
    ".evren",
    ".venv",
    "venv",
    "build",
    "dist",
    "__pycache__",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::pytest.PytestCollectionWarning",
]
